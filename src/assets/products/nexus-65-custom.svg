<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e"/>
      <stop offset="100%" style="stop-color:#0f1218"/>
    </linearGradient>
    <linearGradient id="kbBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a4050"/>
      <stop offset="100%" style="stop-color:#252a38"/>
    </linearGradient>
    <linearGradient id="aluminum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5a6070"/>
      <stop offset="50%" style="stop-color:#7a8090"/>
      <stop offset="100%" style="stop-color:#5a6070"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a3040"/>
      <stop offset="100%" style="stop-color:#1a1f2e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(57,255,20,0.05)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>

  <!-- Glow -->
  <ellipse cx="200" cy="170" rx="130" ry="35" fill="rgba(57,255,20,0.15)" filter="url(#glow)"/>

  <!-- 65% Keyboard with aluminum case -->
  <g transform="translate(70, 70)">
    <!-- Aluminum case frame -->
    <rect x="-4" y="-4" width="268" height="168" rx="12" ry="12" fill="url(#aluminum)" stroke="#8a90a0" stroke-width="1"/>
    
    <!-- Keyboard body -->
    <rect x="0" y="0" width="260" height="160" rx="8" ry="8" fill="url(#kbBody)"/>
    <rect x="2" y="2" width="256" height="3" rx="1" fill="#39ff14" opacity="0.4"/>

    <!-- RGB underglow -->
    <rect x="10" y="155" width="240" height="3" rx="1" fill="#39ff14" opacity="0.6" filter="url(#glow)"/>

    <!-- Key rows -->
    <!-- Row 1 -->
    <g fill="url(#keyGrad)" stroke="#3a4050" stroke-width="0.5">
      <rect x="10" y="15" width="22" height="20" rx="3"/>
      <rect x="36" y="15" width="22" height="20" rx="3"/>
      <rect x="62" y="15" width="22" height="20" rx="3"/>
      <rect x="88" y="15" width="22" height="20" rx="3"/>
      <rect x="114" y="15" width="22" height="20" rx="3"/>
      <rect x="140" y="15" width="22" height="20" rx="3"/>
      <rect x="166" y="15" width="22" height="20" rx="3"/>
      <rect x="192" y="15" width="22" height="20" rx="3"/>
      <rect x="218" y="15" width="22" height="20" rx="3"/>
      <rect x="244" y="15" width="0" height="0" rx="3"/>
    </g>

    <!-- Row 2 (numbers) -->
    <g fill="url(#keyGrad)" stroke="#3a4050" stroke-width="0.5">
      <rect x="8" y="40" width="24" height="20" rx="3"/>
      <rect x="36" y="40" width="24" height="20" rx="3"/>
      <rect x="64" y="40" width="24" height="20" rx="3"/>
      <rect x="92" y="40" width="24" height="20" rx="3"/>
      <rect x="120" y="40" width="24" height="20" rx="3"/>
      <rect x="148" y="40" width="24" height="20" rx="3"/>
      <rect x="176" y="40" width="24" height="20" rx="3"/>
      <rect x="204" y="40" width="24" height="20" rx="3"/>
      <rect x="232" y="40" width="20" height="20" rx="3"/>
    </g>

    <!-- Row 3 (QWERTY) -->
    <g fill="url(#keyGrad)" stroke="#3a4050" stroke-width="0.5">
      <rect x="8" y="65" width="32" height="20" rx="3"/>
      <rect x="44" y="65" width="24" height="20" rx="3"/>
      <rect x="72" y="65" width="24" height="20" rx="3"/>
      <rect x="100" y="65" width="24" height="20" rx="3"/>
      <rect x="128" y="65" width="24" height="20" rx="3"/>
      <rect x="156" y="65" width="24" height="20" rx="3"/>
      <rect x="184" y="65" width="24" height="20" rx="3"/>
      <rect x="212" y="65" width="24" height="20" rx="3"/>
      <rect x="240" y="65" width="12" height="20" rx="2"/>
    </g>

    <!-- Row 4 (ASDF) -->
    <g fill="url(#keyGrad)" stroke="#3a4050" stroke-width="0.5">
      <rect x="8" y="90" width="38" height="20" rx="3"/>
      <rect x="50" y="90" width="24" height="20" rx="3"/>
      <rect x="78" y="90" width="24" height="20" rx="3"/>
      <rect x="106" y="90" width="24" height="20" rx="3"/>
      <rect x="134" y="90" width="24" height="20" rx="3"/>
      <rect x="162" y="90" width="24" height="20" rx="3"/>
      <rect x="190" y="90" width="24" height="20" rx="3"/>
      <rect x="218" y="90" width="34" height="20" rx="3"/>
    </g>

    <!-- Row 5 (ZXCV) -->
    <g fill="url(#keyGrad)" stroke="#3a4050" stroke-width="0.5">
      <rect x="8" y="115" width="48" height="20" rx="3"/>
      <rect x="60" y="115" width="24" height="20" rx="3"/>
      <rect x="88" y="115" width="24" height="20" rx="3"/>
      <rect x="116" y="115" width="24" height="20" rx="3"/>
      <rect x="144" y="115" width="24" height="20" rx="3"/>
      <rect x="172" y="115" width="24" height="20" rx="3"/>
      <rect x="200" y="115" width="52" height="20" rx="3"/>
    </g>

    <!-- Bottom row -->
    <g fill="url(#keyGrad)" stroke="#3a4050" stroke-width="0.5">
      <rect x="8" y="140" width="26" height="16" rx="2"/>
      <rect x="38" y="140" width="26" height="16" rx="2"/>
      <rect x="68" y="140" width="80" height="16" rx="2"/>
      <rect x="152" y="140" width="26" height="16" rx="2"/>
      <rect x="182" y="140" width="26" height="16" rx="2"/>
      <rect x="212" y="140" width="40" height="16" rx="2"/>
    </g>

    <!-- Glowing accent key -->
    <rect x="218" y="90" width="34" height="20" rx="3" fill="rgba(57,255,20,0.15)" stroke="#39ff14" stroke-width="1" filter="url(#glow)"/>

    <!-- Brand -->
    <text x="130" y="8" font-family="monospace" font-size="9" fill="#39ff14" opacity="0.5" letter-spacing="1.5">NEXUS 65 CUSTOM</text>
  </g>

  <!-- Particles -->
  <circle cx="60" cy="40" r="2" fill="#39ff14" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="340" cy="260" r="1.5" fill="#39ff14" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
