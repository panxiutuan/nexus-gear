<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e"/>
      <stop offset="100%" style="stop-color:#0f1218"/>
    </linearGradient>
    <linearGradient id="caseBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a3040"/>
      <stop offset="100%" style="stop-color:#151820"/>
    </linearGradient>
    <linearGradient id="budBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a4050"/>
      <stop offset="100%" style="stop-color:#202533"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,43,214,0.05)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>

  <ellipse cx="200" cy="250" rx="120" ry="25" fill="rgba(255,43,214,0.12)" filter="url(#glow)"/>

  <!-- Charging case -->
  <g transform="translate(100, 120)">
    <!-- Case body -->
    <rect x="0" y="20" width="200" height="100" rx="20" ry="20" fill="url(#caseBody)" stroke="#3a4050" stroke-width="1"/>
    
    <!-- Case lid -->
    <rect x="0" y="0" width="200" height="30" rx="20" ry="20" fill="#252a38" stroke="#3a4050" stroke-width="1"/>
    
    <!-- Front LED -->
    <circle cx="100" cy="60" r="4" fill="#ff2bd6" filter="url(#glow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Earbud slots -->
    <ellipse cx="60" cy="55" rx="25" ry="30" fill="#0a0d12" stroke="#1a1f2e" stroke-width="1"/>
    <ellipse cx="140" cy="55" rx="25" ry="30" fill="#0a0d12" stroke="#1a1f2e" stroke-width="1"/>

    <!-- Left earbud in case -->
    <g transform="translate(60, 40)">
      <ellipse cx="0" cy="15" rx="12" ry="18" fill="url(#budBody)" stroke="#4a5060" stroke-width="0.5"/>
      <ellipse cx="0" cy="12" rx="8" ry="10" fill="#1a1f2e"/>
      <circle cx="0" cy="12" r="3" fill="#ff2bd6" opacity="0.6"/>
    </g>

    <!-- Right earbud floating -->
    <g transform="translate(280, 30)">
      <!-- Stem -->
      <rect x="-4" y="20" width="8" height="35" rx="4" fill="url(#budBody)" stroke="#4a5060" stroke-width="0.5"/>
      <!-- Tip -->
      <ellipse cx="0" cy="12" rx="14" ry="18" fill="url(#budBody)" stroke="#4a5060" stroke-width="0.5"/>
      <!-- Speaker grille -->
      <ellipse cx="0" cy="8" rx="9" ry="11" fill="#1a1f2e"/>
      <g stroke="rgba(255,43,214,0.2)" stroke-width="0.5">
        <circle cx="0" cy="8" r="3" fill="none"/>
        <circle cx="0" cy="8" r="6" fill="none"/>
      </g>
      <!-- Touch sensor -->
      <circle cx="0" cy="32" r="5" fill="#252a38" stroke="#ff2bd6" stroke-width="0.5" filter="url(#glow)"/>
      <!-- Brand -->
      <text x="0" y="33" font-family="monospace" font-size="5" fill="#ff2bd6" opacity="0.6" text-anchor="middle">N</text>
    </g>

    <!-- Brand on case -->
    <text x="100" y="100" font-family="monospace" font-size="8" fill="#ff2bd6" opacity="0.4" text-anchor="middle" letter-spacing="1.5">NEXUS BUDS X</text>

    <!-- Battery indicator -->
    <text x="100" y="112" font-family="monospace" font-size="7" fill="#ff2bd6" opacity="0.5" text-anchor="middle">36h 总续航</text>
  </g>

  <!-- Floating connection lines -->
  <g stroke="#ff2bd6" stroke-width="1" fill="none" opacity="0.3" stroke-dasharray="3,3">
    <path d="M300 80 Q320 60 340 70">
      <animate attributeName="stroke-dashoffset" values="0;6" dur="1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Specs -->
  <g font-family="monospace" font-size="9" fill="#ff2bd6" opacity="0.5">
    <text x="30" y="60">主动降噪 ANC</text>
    <text x="30" y="75">蓝牙 5.3</text>
    <text x="290" y="50">IPX5 防水</text>
    <text x="290" y="65">无线充电</text>
  </g>

  <circle cx="50" cy="200" r="2" fill="#ff2bd6" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="220" r="1.5" fill="#ff2bd6" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
