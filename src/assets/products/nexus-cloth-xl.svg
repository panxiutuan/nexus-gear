<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e"/>
      <stop offset="100%" style="stop-color:#0f1218"/>
    </linearGradient>
    <linearGradient id="padTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e"/>
      <stop offset="100%" style="stop-color:#0f1218"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a3040"/>
      <stop offset="100%" style="stop-color:#151820"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,180,0,0.05)" stroke-width="0.5"/>
    </pattern>
    <pattern id="clothWeave" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#151820"/>
      <line x1="0" y1="0" x2="8" y2="8" stroke="#1a1f2e" stroke-width="0.5"/>
      <line x1="8" y1="0" x2="0" y2="8" stroke="#1a1f2e" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>

  <ellipse cx="200" cy="240" rx="180" ry="30" fill="rgba(255,180,0,0.1)" filter="url(#glow)"/>

  <!-- XL Cloth Mousepad - perspective view -->
  <g transform="translate(30, 80)">
    <!-- Pad thickness/edge -->
    <polygon points="0,20 340,20 320,130 20,130" fill="#1a1f2e"/>
    <polygon points="0,20 20,130 20,136 0,26" fill="#252a38"/>
    <polygon points="340,20 320,130 320,136 340,26" fill="#0a0d12"/>
    
    <!-- Top surface -->
    <polygon points="10,0 330,0 310,120 30,120" fill="url(#padTop)" stroke="#2a3040" stroke-width="1"/>
    
    <!-- Cloth texture overlay -->
    <polygon points="10,0 330,0 310,120 30,120" fill="url(#clothWeave)" opacity="0.3"/>

    <!-- Stitched edges -->
    <polyline points="10,0 330,0 310,120 30,120 10,0" fill="none" stroke="#ffb400" stroke-width="1" opacity="0.4" stroke-dasharray="4,2"/>

    <!-- Logo/text -->
    <text x="170" y="65" font-family="monospace" font-size="18" fill="#ffb400" opacity="0.6" text-anchor="middle" letter-spacing="4" font-weight="bold">NEXUS</text>
    <text x="170" y="82" font-family="monospace" font-size="9" fill="#ffb400" opacity="0.4" text-anchor="middle" letter-spacing="2">CLOTH XL</text>

    <!-- Size indicator -->
    <g transform="translate(300, 20)" font-family="monospace" font-size="7" fill="#ffb400" opacity="0.5">
      <text x="0" y="0">900x400</text>
      <text x="0" y="10">x 4mm</text>
    </g>

    <!-- Corner accent -->
    <circle cx="25" cy="15" r="3" fill="#ffb400" opacity="0.6" filter="url(#glow)"/>
    <circle cx="315" cy="15" r="3" fill="#ffb400" opacity="0.6" filter="url(#glow)"/>
  </g>

  <!-- Mouse on pad -->
  <g transform="translate(140, 130)">
    <ellipse cx="25" cy="50" rx="22" ry="5" fill="rgba(0,0,0,0.3)"/>
    <path d="M5 30 Q5 5 25 0 Q45 5 45 30 Q45 50 25 58 Q5 50 5 30Z" 
          fill="#2a3040" stroke="#3a4050" stroke-width="0.5"/>
    <line x1="25" y1="8" x2="25" y2="30" stroke="#1a1f2e" stroke-width="0.5"/>
    <circle cx="25" cy="15" r="2" fill="#ffb400" opacity="0.8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Specs -->
  <g font-family="monospace" font-size="9" fill="#ffb400" opacity="0.5">
    <text x="20" y="50">精细编织表面</text>
    <text x="20" y="65">天然橡胶底</text>
    <text x="300" y="50">锁边工艺</text>
    <text x="300" y="65">4mm 加厚</text>
  </g>

  <circle cx="50" cy="250" r="2" fill="#ffb400" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="80" r="1.5" fill="#ffb400" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
