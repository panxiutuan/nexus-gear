<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e"/>
      <stop offset="100%" style="stop-color:#0f1218"/>
    </linearGradient>
    <linearGradient id="matTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2030"/>
      <stop offset="100%" style="stop-color:#15161e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,180,0,0.05)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>

  <ellipse cx="200" cy="250" rx="200" ry="25" fill="rgba(255,180,0,0.08)" filter="url(#glow)"/>

  <!-- Desk Mat Pro - large desk mat with wireless charging -->
  <g transform="translate(10, 90)">
    <!-- Side/edge -->
    <polygon points="0,15 380,15 360,100 20,100" fill="#1a1f2e"/>
    <polygon points="0,15 20,100 20,104 0,19" fill="#252a38"/>
    
    <!-- Top surface -->
    <polygon points="8,0 372,0 352,90 28,90" fill="url(#matTop)" stroke="#2a3040" stroke-width="1"/>

    <!-- Stitched border -->
    <polyline points="8,0 372,0 352,90 28,90 8,0" fill="none" stroke="#ffb400" stroke-width="1" opacity="0.3" stroke-dasharray="5,2"/>

    <!-- Wireless charging area -->
    <g transform="translate(60, 25)">
      <circle cx="0" cy="20" r="18" fill="none" stroke="#ffb400" stroke-width="1.5" opacity="0.4" stroke-dasharray="3,2"/>
      <circle cx="0" cy="20" r="12" fill="none" stroke="#ffb400" stroke-width="1" opacity="0.3"/>
      <text x="0" y="24" font-family="monospace" font-size="7" fill="#ffb400" opacity="0.5" text-anchor="middle">⚡ 15W</text>
    </g>

    <!-- RGB strip along front edge -->
    <rect x="28" y="85" width="324" height="4" rx="2" fill="#ffb400" opacity="0.4" filter="url(#glow)">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
    </rect>

    <!-- Brand logo center -->
    <text x="190" y="50" font-family="monospace" font-size="16" fill="#ffb400" opacity="0.5" text-anchor="middle" letter-spacing="4">NEXUS GEAR</text>
    <text x="190" y="65" font-family="monospace" font-size="8" fill="#ffb400" opacity="0.3" text-anchor="middle" letter-spacing="2">DESK MAT PRO</text>

    <!-- Cable port -->
    <rect x="355" y="30" width="8" height="20" rx="2" fill="#0a0d12" stroke="#2a3040" stroke-width="0.5"/>

    <!-- Size badge -->
    <g transform="translate(300, 10)" font-family="monospace" font-size="7" fill="#ffb400" opacity="0.5">
      <text x="0" y="0">900x450mm</text>
      <text x="0" y="10">4mm 厚度</text>
    </g>
  </g>

  <!-- Keyboard on mat -->
  <g transform="translate(100, 60)" opacity="0.6">
    <rect x="0" y="0" width="180" height="60" rx="4" fill="#2a3040"/>
    <g fill="#1a1f2e">
      <rect x="8" y="8" width="14" height="10" rx="2"/>
      <rect x="26" y="8" width="14" height="10" rx="2"/>
      <rect x="44" y="8" width="14" height="10" rx="2"/>
      <rect x="62" y="8" width="14" height="10" rx="2"/>
      <rect x="80" y="8" width="14" height="10" rx="2"/>
      <rect x="98" y="8" width="14" height="10" rx="2"/>
      <rect x="116" y="8" width="14" height="10" rx="2"/>
      <rect x="134" y="8" width="14" height="10" rx="2"/>
      <rect x="152" y="8" width="14" height="10" rx="2"/>
      <rect x="8" y="22" width="14" height="10" rx="2"/>
      <rect x="26" y="22" width="14" height="10" rx="2"/>
      <rect x="44" y="22" width="14" height="10" rx="2"/>
      <rect x="62" y="22" width="14" height="10" rx="2"/>
      <rect x="80" y="22" width="14" height="10" rx="2"/>
      <rect x="98" y="22" width="14" height="10" rx="2"/>
      <rect x="116" y="22" width="14" height="10" rx="2"/>
      <rect x="134" y="22" width="14" height="10" rx="2"/>
      <rect x="152" y="22" width="20" height="10" rx="2"/>
      <rect x="8" y="36" width="60" height="10" rx="2"/>
      <rect x="72" y="36" width="40" height="10" rx="2"/>
      <rect x="116" y="36" width="56" height="10" rx="2"/>
    </g>
  </g>

  <!-- Features -->
  <g font-family="monospace" font-size="9" fill="#ffb400" opacity="0.5">
    <text x="20" y="50">无线充电 15W</text>
    <text x="20" y="65">RGB 灯效</text>
    <text x="20" y="80">天然橡胶底</text>
    <text x="300" y="50">防水防油</text>
    <text x="300" y="65">Type-C 接口</text>
  </g>

  <circle cx="60" cy="250" r="2" fill="#ffb400" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="340" cy="70" r="1.5" fill="#ffb400" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
