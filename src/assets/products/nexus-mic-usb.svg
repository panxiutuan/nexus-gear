<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e"/>
      <stop offset="100%" style="stop-color:#0f1218"/>
    </linearGradient>
    <linearGradient id="micBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a4050"/>
      <stop offset="100%" style="stop-color:#1a1f2e"/>
    </linearGradient>
    <linearGradient id="standGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a3040"/>
      <stop offset="100%" style="stop-color:#151820"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,43,214,0.05)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>

  <ellipse cx="200" cy="260" rx="80" ry="20" fill="rgba(255,43,214,0.15)" filter="url(#glow)"/>

  <!-- USB Microphone -->
  <g transform="translate(140, 30)">
    <!-- Base/stand -->
    <ellipse cx="60" cy="220" rx="50" ry="12" fill="url(#standGrad)" stroke="#3a4050" stroke-width="1"/>
    <rect x="52" y="170" width="16" height="52" rx="4" fill="url(#standGrad)" stroke="#3a4050" stroke-width="0.5"/>
    
    <!-- Arm/pivot -->
    <circle cx="60" cy="165" r="8" fill="#2a3040" stroke="#3a4050" stroke-width="0.5"/>

    <!-- Mic body -->
    <rect x="25" y="30" width="70" height="135" rx="15" ry="15" fill="url(#micBody)" stroke="#4a5060" stroke-width="1"/>
    
    <!-- Top grille -->
    <g stroke="rgba(255,43,214,0.2)" stroke-width="0.8" fill="none">
      <rect x="35" y="40" width="50" height="60" rx="10" fill="#0a0d12"/>
      <line x1="40" y1="50" x2="80" y2="50"/>
      <line x1="40" y1="58" x2="80" y2="58"/>
      <line x1="40" y1="66" x2="80" y2="66"/>
      <line x1="40" y1="74" x2="80" y2="74"/>
      <line x1="40" y1="82" x2="80" y2="82"/>
      <line x1="40" y1="90" x2="80" y2="90"/>
      <line x1="40" y1="98" x2="80" y2="98"/>
    </g>

    <!-- RGB ring at top -->
    <ellipse cx="60" cy="45" rx="30" ry="8" fill="none" stroke="#ff2bd6" stroke-width="2" opacity="0.8" filter="url(#glow)"/>

    <!-- Middle control ring -->
    <rect x="30" y="110" width="60" height="8" rx="4" fill="#1a1f2e" stroke="#2a3040" stroke-width="0.5"/>
    <circle cx="60" cy="114" r="3" fill="#ff2bd6" opacity="0.6">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="1.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Bottom section with logo -->
    <rect x="35" y="125" width="50" height="35" rx="8" fill="#151820" stroke="#2a3040" stroke-width="0.5"/>
    <text x="60" y="148" font-family="monospace" font-size="10" fill="#ff2bd6" opacity="0.7" text-anchor="middle" font-weight="bold">NEXUS</text>
    <text x="60" y="158" font-family="monospace" font-size="6" fill="#ff2bd6" opacity="0.4" text-anchor="middle">MIC USB</text>

    <!-- Mute button -->
    <circle cx="60" cy="185" r="6" fill="#2a3040" stroke="#ff2bd6" stroke-width="0.5"/>
    <text x="60" y="188" font-family="monospace" font-size="5" fill="#ff2bd6" text-anchor="middle">MUTE</text>
  </g>

  <!-- Sound wave -->
  <g transform="translate(60, 120)" fill="none" stroke="#ff2bd6" stroke-width="1.5" opacity="0.4">
    <path d="M0 20 Q10 10 20 20 Q30 30 40 20">
      <animate attributeName="d" values="M0 20 Q10 10 20 20 Q30 30 40 20;M0 20 Q10 30 20 20 Q30 10 40 20;M0 20 Q10 10 20 20 Q30 30 40 20" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M10 20 Q20 5 30 20 Q40 35 50 20" opacity="0.6">
      <animate attributeName="d" values="M10 20 Q20 5 30 20 Q40 35 50 20;M10 20 Q20 35 30 20 Q40 5 50 20;M10 20 Q20 5 30 20 Q40 35 50 20" dur="2.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Specs -->
  <g font-family="monospace" font-size="9" fill="#ff2bd6" opacity="0.5">
    <text x="280" y="80">24bit/192kHz</text>
    <text x="280" y="95">心型指向</text>
    <text x="280" y="110">USB-C 即插即用</text>
  </g>

  <circle cx="80" cy="50" r="2" fill="#ff2bd6" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="220" r="1.5" fill="#ff2bd6" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
