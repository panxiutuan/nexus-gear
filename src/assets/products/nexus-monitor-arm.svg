<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e"/>
      <stop offset="100%" style="stop-color:#0f1218"/>
    </linearGradient>
    <linearGradient id="metalArm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3a4050"/>
      <stop offset="50%" style="stop-color:#5a6070"/>
      <stop offset="100%" style="stop-color:#3a4050"/>
    </linearGradient>
    <linearGradient id="monitor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a3040"/>
      <stop offset="100%" style="stop-color:#1a1f2e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(155,92,255,0.05)" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e"/>
      <stop offset="100%" style="stop-color:#0f1218"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>

  <ellipse cx="200" cy="270" rx="100" ry="15" fill="rgba(155,92,255,0.1)" filter="url(#glow)"/>

  <!-- Monitor Arm -->
  <g transform="translate(60, 20)">
    <!-- Desk clamp base -->
    <g transform="translate(0, 220)">
      <rect x="-15" y="0" width="50" height="12" rx="3" fill="url(#metalArm)" stroke="#4a5060" stroke-width="1"/>
      <rect x="-10" y="12" width="30" height="8" rx="2" fill="#2a3040"/>
      <rect x="-20" y="20" width="40" height="10" rx="2" fill="#3a4050"/>
      <!-- Adjustment knob -->
      <circle cx="-5" cy="25" r="4" fill="#2a3040" stroke="#4a5060" stroke-width="0.5"/>
    </g>

    <!-- Vertical pole -->
    <rect x="5" y="60" width="14" height="170" rx="3" fill="url(#metalArm)" stroke="#4a5060" stroke-width="1"/>
    <!-- Height adjustment rings -->
    <circle cx="12" cy="100" r="9" fill="none" stroke="#9b5cff" stroke-width="1.5" opacity="0.4"/>
    <circle cx="12" cy="140" r="9" fill="none" stroke="#9b5cff" stroke-width="1.5" opacity="0.4"/>
    <circle cx="12" cy="180" r="9" fill="none" stroke="#9b5cff" stroke-width="1.5" opacity="0.4"/>

    <!-- Lower arm -->
    <g transform="translate(12, 80) rotate(-30)">
      <rect x="0" y="-5" width="90" height="10" rx="4" fill="url(#metalArm)" stroke="#4a5060" stroke-width="1"/>
      <!-- Gas spring indicator -->
      <rect x="20" y="-3" width="50" height="6" rx="2" fill="#1a1f2e"/>
      <line x1="25" y1="0" x2="65" y2="0" stroke="#9b5cff" stroke-width="1" opacity="0.5"/>
    </g>

    <!-- Upper arm -->
    <g transform="translate(90, 35) rotate(20)">
      <rect x="0" y="-4" width="70" height="8" rx="3" fill="url(#metalArm)" stroke="#4a5060" stroke-width="1"/>
    </g>

    <!-- VESA mount head -->
    <g transform="translate(155, 12)">
      <circle cx="0" cy="12" r="10" fill="#2a3040" stroke="#4a5060" stroke-width="1"/>
      <circle cx="0" cy="12" r="5" fill="#1a1f2e"/>
      <rect x="-3" y="-2" width="6" height="8" rx="1" fill="#3a4050"/>
    </g>

    <!-- Monitor -->
    <g transform="translate(170, -30)">
      <!-- Monitor body -->
      <rect x="0" y="0" width="120" height="75" rx="4" fill="url(#monitor)" stroke="#4a5060" stroke-width="1"/>
      <!-- Screen -->
      <rect x="5" y="5" width="110" height="60" rx="2" fill="url(#screen)"/>
      <!-- Screen content (faint grid + glow) -->
      <g opacity="0.3">
        <line x1="10" y1="15" x2="110" y2="15" stroke="#9b5cff" stroke-width="0.5"/>
        <line x1="10" y1="25" x2="110" y2="25" stroke="#9b5cff" stroke-width="0.5"/>
        <line x1="10" y1="35" x2="110" y2="35" stroke="#9b5cff" stroke-width="0.5"/>
        <line x1="10" y1="45" x2="110" y2="45" stroke="#9b5cff" stroke-width="0.5"/>
        <line x1="10" y1="55" x2="110" y2="55" stroke="#9b5cff" stroke-width="0.5"/>
        <rect x="10" y="15" width="30" height="30" fill="#9b5cff" opacity="0.1"/>
      </g>
      <!-- Screen glow -->
      <rect x="5" y="5" width="110" height="60" rx="2" fill="none" stroke="#9b5cff" stroke-width="0.5" opacity="0.3" filter="url(#glow)"/>
      <!-- Bottom bezel -->
      <rect x="0" y="68" width="120" height="7" rx="2" fill="#1a1f2e"/>
      <text x="60" y="74" font-family="monospace" font-size="5" fill="#9b5cff" opacity="0.5" text-anchor="middle">NEXUS</text>
    </g>

    <!-- Cable management clip -->
    <g transform="translate(70, 60)">
      <path d="M0 0 Q10 5 0 10" fill="none" stroke="#2a3040" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Brand on base -->
    <text x="10" y="265" font-family="monospace" font-size="7" fill="#9b5cff" opacity="0.5" letter-spacing="1">NEXUS ARM</text>
  </g>

  <!-- Feature highlights -->
  <g font-family="monospace" font-size="9" fill="#9b5cff" opacity="0.5">
    <text x="20" y="40">单臂承重 9kg</text>
    <text x="20" y="55">气弹簧升降</text>
    <text x="20" y="70">360° 旋转</text>
    <text x="280" y="30">17-32" 显示器</text>
    <text x="280" y="45">VESA 75/100</text>
    <text x="280" y="60">桌夹/穿孔安装</text>
  </g>

  <!-- Range indicators -->
  <g stroke="#9b5cff" stroke-width="1" stroke-dasharray="3,2" fill="none" opacity="0.3">
    <path d="M280 80 Q250 150 280 220"/>
  </g>
  <text x="285" y="150" font-family="monospace" font-size="7" fill="#9b5cff" opacity="0.5">±90°</text>

  <circle cx="300" cy="200" r="2" fill="#9b5cff" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="60" r="1.5" fill="#9b5cff" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
