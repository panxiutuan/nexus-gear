<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e"/>
      <stop offset="100%" style="stop-color:#0f1218"/>
    </linearGradient>
    <linearGradient id="padBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a3040"/>
      <stop offset="100%" style="stop-color:#1a1f2e"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a4050"/>
      <stop offset="100%" style="stop-color:#252a38"/>
    </linearGradient>
    <linearGradient id="knob" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5a6070"/>
      <stop offset="100%" style="stop-color:#3a4050"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(57,255,20,0.05)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>

  <ellipse cx="200" cy="180" rx="80" ry="40" fill="rgba(57,255,20,0.15)" filter="url(#glow)"/>

  <!-- Numpad -->
  <g transform="translate(130, 50)">
    <rect x="0" y="10" width="140" height="190" rx="8" ry="8" fill="url(#padBody)" stroke="#3a4050" stroke-width="1"/>
    <rect x="2" y="12" width="136" height="3" rx="1" fill="#39ff14" opacity="0.3"/>

    <!-- Display -->
    <rect x="10" y="25" width="120" height="28" rx="4" fill="#0a0d12" stroke="#2a3040" stroke-width="0.5"/>
    <text x="125" y="44" font-family="monospace" font-size="14" fill="#39ff14" text-anchor="end" opacity="0.8">0.00</text>

    <!-- Volume knob -->
    <circle cx="115" cy="90" r="16" fill="url(#knob)" stroke="#4a5060" stroke-width="1"/>
    <circle cx="115" cy="90" r="12" fill="#1a1f2e" stroke="#39ff14" stroke-width="1" filter="url(#glow)"/>
    <line x1="115" y1="80" x2="115" y2="84" stroke="#39ff14" stroke-width="2" stroke-linecap="round"/>

    <!-- Number keys -->
    <g fill="url(#keyGrad)" stroke="#4a5060" stroke-width="0.5">
      <rect x="10" y="70" width="26" height="22" rx="3"/>
      <rect x="40" y="70" width="26" height="22" rx="3"/>
      <rect x="70" y="70" width="26" height="22" rx="3"/>
      
      <rect x="10" y="96" width="26" height="22" rx="3"/>
      <rect x="40" y="96" width="26" height="22" rx="3"/>
      <rect x="70" y="96" width="26" height="22" rx="3"/>
      
      <rect x="10" y="122" width="26" height="22" rx="3"/>
      <rect x="40" y="122" width="26" height="22" rx="3"/>
      <rect x="70" y="122" width="26" height="22" rx="3"/>
      
      <rect x="10" y="148" width="56" height="22" rx="3"/>
      <rect x="70" y="148" width="26" height="22" rx="3"/>
      <rect x="100" y="122" width="30" height="48" rx="3"/>
    </g>

    <!-- Glowing enter key -->
    <rect x="100" y="122" width="30" height="48" rx="3" fill="rgba(57,255,20,0.15)" stroke="#39ff14" stroke-width="1" filter="url(#glow)"/>

    <text x="70" y="8" font-family="monospace" font-size="8" fill="#39ff14" opacity="0.5" letter-spacing="1">NEXUS NUMPAD MINI</text>
  </g>

  <circle cx="80" cy="80" r="2" fill="#39ff14" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="220" r="1.5" fill="#39ff14" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
