<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e"/>
      <stop offset="100%" style="stop-color:#0f1218"/>
    </linearGradient>
    <linearGradient id="mouseBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#252a38"/>
      <stop offset="50%" style="stop-color:#1a1f2e"/>
      <stop offset="100%" style="stop-color:#0f1218"/>
    </linearGradient>
    <linearGradient id="mouseTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#353a48"/>
      <stop offset="100%" style="stop-color:#252a38"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0,229,255,0.05)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>

  <ellipse cx="200" cy="240" rx="90" ry="25" fill="rgba(0,229,255,0.18)" filter="url(#glow)"/>

  <!-- Superlight mouse - slim profile -->
  <g transform="translate(135, 45)">
    <!-- Shadow -->
    <ellipse cx="65" cy="205" rx="50" ry="8" fill="rgba(0,0,0,0.35)"/>
    
    <!-- Mouse body - ultra slim -->
    <path d="M15 95 Q15 25 65 15 Q115 25 115 95 Q115 160 65 180 Q15 160 15 95Z" 
          fill="url(#mouseBody)" stroke="#3a4050" stroke-width="1"/>

    <!-- Full honeycomb pattern for superlight -->
    <g fill="none" stroke="rgba(0,229,255,0.12)" stroke-width="0.4">
      <!-- Top honeycomb -->
      <circle cx="35" cy="55" r="4"/>
      <circle cx="55" cy="50" r="4"/>
      <circle cx="75" cy="50" r="4"/>
      <circle cx="95" cy="55" r="4"/>
      <circle cx="45" cy="70" r="4"/>
      <circle cx="65" cy="65" r="4"/>
      <circle cx="85" cy="70" r="4"/>
      <circle cx="35" cy="85" r="4"/>
      <circle cx="55" cy="80" r="4"/>
      <circle cx="75" cy="80" r="4"/>
      <circle cx="95" cy="85" r="4"/>
      <!-- Sides -->
      <circle cx="22" cy="110" r="3"/>
      <circle cx="28" cy="130" r="3"/>
      <circle cx="22" cy="150" r="3"/>
      <circle cx="108" cy="110" r="3"/>
      <circle cx="102" cy="130" r="3"/>
      <circle cx="108" cy="150" r="3"/>
    </g>

    <!-- Buttons -->
    <path d="M20 90 Q20 30 60 22 L60 90 Q40 95 20 90Z" 
          fill="url(#mouseTop)" stroke="#3a4050" stroke-width="0.5"/>
    
    <path d="M70 22 Q110 30 110 90 Q90 95 70 90Z" 
          fill="url(#mouseTop)" stroke="#3a4050" stroke-width="0.5"/>

    <!-- Minimal scroll wheel -->
    <rect x="58" y="38" width="14" height="26" rx="3" fill="#151820" stroke="#2a3040" stroke-width="0.5"/>
    <line x1="60" y1="48" x2="70" y2="48" stroke="#2a3040" stroke-width="1"/>
    <line x1="60" y1="58" x2="70" y2="58" stroke="#2a3040" stroke-width="1"/>

    <!-- RGB ring on bottom -->
    <ellipse cx="65" cy="178" rx="45" ry="5" fill="rgba(0,229,255,0.6)" filter="url(#glow)"/>

    <!-- Weight badge -->
    <g transform="translate(130, 80)">
      <circle cx="0" cy="0" r="18" fill="#1a1f2e" stroke="#00e5ff" stroke-width="1" filter="url(#glow)"/>
      <text x="0" y="-2" font-family="monospace" font-size="10" fill="#00e5ff" text-anchor="middle" font-weight="bold">49g</text>
      <text x="0" y="8" font-family="monospace" font-size="5" fill="#00e5ff" opacity="0.6" text-anchor="middle">超轻</text>
    </g>

    <!-- Brand -->
    <text x="65" y="168" font-family="monospace" font-size="7" fill="#00e5ff" opacity="0.6" text-anchor="middle" letter-spacing="1">NEXUS SUPERLIGHT</text>
  </g>

  <!-- Spec labels -->
  <g font-family="monospace" font-size="9" fill="#00e5ff" opacity="0.5">
    <text x="40" y="60">PAW3395</text>
    <text x="40" y="75">26K DPI</text>
    <text x="310" y="80">49g 极致轻</text>
    <text x="310" y="95">1000Hz 回报率</text>
  </g>

  <circle cx="70" cy="220" r="2" fill="#00e5ff" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="330" cy="200" r="1.5" fill="#00e5ff" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
