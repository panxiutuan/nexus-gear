<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e"/>
      <stop offset="100%" style="stop-color:#0f1218"/>
    </linearGradient>
    <linearGradient id="kbBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a3040"/>
      <stop offset="100%" style="stop-color:#1a1f2e"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a4050"/>
      <stop offset="100%" style="stop-color:#252a38"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(57,255,20,0.05)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>

  <!-- Glow effect behind keyboard -->
  <ellipse cx="200" cy="180" rx="160" ry="40" fill="rgba(57,255,20,0.15)" filter="url(#glow)"/>

  <!-- Keyboard body (TKL 80%) -->
  <g transform="translate(40, 80)">
    <!-- Keyboard base -->
    <rect x="0" y="20" width="320" height="120" rx="8" ry="8" fill="url(#kbBody)" stroke="#3a4050" stroke-width="1"/>
    <rect x="2" y="22" width="316" height="4" rx="2" fill="#39ff14" opacity="0.3"/>

    <!-- Top row (function keys) -->
    <g fill="url(#keyGrad)" stroke="#4a5060" stroke-width="0.5">
      <rect x="10" y="35" width="24" height="20" rx="3"/>
      <rect x="40" y="35" width="24" height="20" rx="3"/>
      <rect x="70" y="35" width="24" height="20" rx="3"/>
      <rect x="100" y="35" width="24" height="20" rx="3"/>
      <rect x="130" y="35" width="24" height="20" rx="3"/>
      <rect x="160" y="35" width="24" height="20" rx="3"/>
      <rect x="190" y="35" width="24" height="20" rx="3"/>
      <rect x="220" y="35" width="24" height="20" rx="3"/>
      <rect x="250" y="35" width="24" height="20" rx="3"/>
      <rect x="280" y="35" width="24" height="20" rx="3"/>
      <rect x="310" y="35" width="0" height="0" rx="3"/>
    </g>

    <!-- Number row -->
    <g fill="url(#keyGrad)" stroke="#4a5060" stroke-width="0.5">
      <rect x="8" y="60" width="26" height="22" rx="3"/>
      <rect x="38" y="60" width="26" height="22" rx="3"/>
      <rect x="68" y="60" width="26" height="22" rx="3"/>
      <rect x="98" y="60" width="26" height="22" rx="3"/>
      <rect x="128" y="60" width="26" height="22" rx="3"/>
      <rect x="158" y="60" width="26" height="22" rx="3"/>
      <rect x="188" y="60" width="26" height="22" rx="3"/>
      <rect x="218" y="60" width="26" height="22" rx="3"/>
      <rect x="248" y="60" width="26" height="22" rx="3"/>
      <rect x="278" y="60" width="34" height="22" rx="3"/>
    </g>

    <!-- Tab row -->
    <g fill="url(#keyGrad)" stroke="#4a5060" stroke-width="0.5">
      <rect x="8" y="86" width="36" height="22" rx="3"/>
      <rect x="48" y="86" width="26" height="22" rx="3"/>
      <rect x="78" y="86" width="26" height="22" rx="3"/>
      <rect x="108" y="86" width="26" height="22" rx="3"/>
      <rect x="138" y="86" width="26" height="22" rx="3"/>
      <rect x="168" y="86" width="26" height="22" rx="3"/>
      <rect x="198" y="86" width="26" height="22" rx="3"/>
      <rect x="228" y="86" width="26" height="22" rx="3"/>
      <rect x="258" y="86" width="26" height="22" rx="3"/>
      <rect x="288" y="86" width="24" height="22" rx="3"/>
    </g>

    <!-- Caps row -->
    <g fill="url(#keyGrad)" stroke="#4a5060" stroke-width="0.5">
      <rect x="8" y="112" width="42" height="22" rx="3"/>
      <rect x="54" y="112" width="26" height="22" rx="3"/>
      <rect x="84" y="112" width="26" height="22" rx="3"/>
      <rect x="114" y="112" width="26" height="22" rx="3"/>
      <rect x="144" y="112" width="26" height="22" rx="3"/>
      <rect x="174" y="112" width="26" height="22" rx="3"/>
      <rect x="204" y="112" width="26" height="22" rx="3"/>
      <rect x="234" y="112" width="26" height="22" rx="3"/>
      <rect x="264" y="112" width="48" height="22" rx="3"/>
    </g>

    <!-- Shift row -->
    <g fill="url(#keyGrad)" stroke="#4a5060" stroke-width="0.5">
      <rect x="8" y="138" width="56" height="22" rx="3"/>
      <rect x="68" y="138" width="26" height="22" rx="3"/>
      <rect x="98" y="138" width="26" height="22" rx="3"/>
      <rect x="128" y="138" width="26" height="22" rx="3"/>
      <rect x="158" y="138" width="26" height="22" rx="3"/>
      <rect x="188" y="138" width="26" height="22" rx="3"/>
      <rect x="218" y="138" width="26" height="22" rx="3"/>
      <rect x="248" y="138" width="64" height="22" rx="3"/>
    </g>

    <!-- Bottom row -->
    <g fill="url(#keyGrad)" stroke="#4a5060" stroke-width="0.5">
      <rect x="8" y="164" width="30" height="22" rx="3"/>
      <rect x="42" y="164" width="30" height="22" rx="3"/>
      <rect x="76" y="164" width="30" height="22" rx="3"/>
      <rect x="110" y="164" width="100" height="22" rx="3"/>
      <rect x="214" y="164" width="30" height="22" rx="3"/>
      <rect x="248" y="164" width="30" height="22" rx="3"/>
      <rect x="282" y="164" width="30" height="22" rx="3"/>
    </g>

    <!-- Accent key (Enter key glowing) -->
    <rect x="264" y="112" width="48" height="22" rx="3" fill="rgba(57,255,20,0.2)" stroke="#39ff14" stroke-width="1" filter="url(#glow)"/>

    <!-- Brand logo -->
    <text x="160" y="15" font-family="monospace" font-size="10" fill="#39ff14" opacity="0.6" letter-spacing="2">NEXUS TKL PRO</text>
  </g>

  <!-- Floating particles -->
  <circle cx="50" cy="50" r="2" fill="#39ff14" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="250" r="1.5" fill="#39ff14" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="60" r="1" fill="#39ff14" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
