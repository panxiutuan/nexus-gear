<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e"/>
      <stop offset="100%" style="stop-color:#0f1218"/>
    </linearGradient>
    <linearGradient id="foamTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a3550"/>
      <stop offset="100%" style="stop-color:#252040"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e"/>
      <stop offset="100%" style="stop-color:#0f1218"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(155,92,255,0.05)" stroke-width="0.5"/>
    </pattern>
    <pattern id="foamTexture" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.8" fill="rgba(155,92,255,0.08)"/>
    </pattern>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>

  <ellipse cx="200" cy="240" rx="160" ry="25" fill="rgba(155,92,255,0.12)" filter="url(#glow)"/>

  <!-- Wrist Rest -->
  <g transform="translate(40, 100)">
    <!-- Shadow -->
    <ellipse cx="160" cy="140" rx="150" ry="10" fill="rgba(0,0,0,0.3)"/>
    
    <!-- Base -->
    <rect x="5" y="100" width="310" height="40" rx="8" ry="8" fill="url(#baseGrad)" stroke="#2a3040" stroke-width="1"/>
    
    <!-- Memory foam cushion -->
    <path d="M10 100 Q10 40 50 30 L270 30 Q310 40 310 100 Z" 
          fill="url(#foamTop)" stroke="#4a4060" stroke-width="1"/>
    
    <!-- Foam texture -->
    <path d="M10 100 Q10 40 50 30 L270 30 Q310 40 310 100 Z" 
          fill="url(#foamTexture)"/>

    <!-- Ergonomic curve highlight -->
    <path d="M50 32 Q160 18 270 32" fill="none" stroke="rgba(155,92,255,0.3)" stroke-width="1.5"/>

    <!-- Side stitching -->
    <path d="M10 100 Q10 40 50 30" fill="none" stroke="#9b5cff" stroke-width="1" opacity="0.3" stroke-dasharray="3,2"/>
    <path d="M310 100 Q310 40 270 30" fill="none" stroke="#9b5cff" stroke-width="1" opacity="0.3" stroke-dasharray="3,2"/>

    <!-- Brand -->
    <text x="160" y="72" font-family="monospace" font-size="12" fill="#9b5cff" opacity="0.6" text-anchor="middle" letter-spacing="3">NEXUS</text>
    <text x="160" y="88" font-family="monospace" font-size="7" fill="#9b5cff" opacity="0.4" text-anchor="middle" letter-spacing="2">WRIST REST</text>

    <!-- Size info -->
    <g font-family="monospace" font-size="7" fill="#9b5cff" opacity="0.4">
      <text x="160" y="132" text-anchor="middle">360 x 80 x 25mm</text>
    </g>

    <!-- Memory foam indicator -->
    <g transform="translate(280, 50)">
      <text x="0" y="0" font-family="monospace" font-size="6" fill="#9b5cff" opacity="0.5">MEMORY</text>
      <text x="0" y="9" font-family="monospace" font-size="6" fill="#9b5cff" opacity="0.5">FOAM</text>
    </g>
  </g>

  <!-- Keyboard (partial view) -->
  <g transform="translate(60, 30)" opacity="0.4">
    <rect x="0" y="0" width="280" height="50" rx="4" fill="#2a3040"/>
    <g fill="#1a1f2e">
      <rect x="8" y="8" width="20" height="12" rx="2"/>
      <rect x="32" y="8" width="20" height="12" rx="2"/>
      <rect x="56" y="8" width="20" height="12" rx="2"/>
      <rect x="80" y="8" width="20" height="12" rx="2"/>
      <rect x="104" y="8" width="20" height="12" rx="2"/>
      <rect x="128" y="8" width="20" height="12" rx="2"/>
      <rect x="152" y="8" width="20" height="12" rx="2"/>
      <rect x="176" y="8" width="20" height="12" rx="2"/>
      <rect x="200" y="8" width="20" height="12" rx="2"/>
      <rect x="224" y="8" width="20" height="12" rx="2"/>
      <rect x="248" y="8" width="20" height="12" rx="2"/>
      <rect x="8" y="24" width="28" height="12" rx="2"/>
      <rect x="40" y="24" width="20" height="12" rx="2"/>
      <rect x="64" y="24" width="20" height="12" rx="2"/>
      <rect x="88" y="24" width="20" height="12" rx="2"/>
      <rect x="112" y="24" width="20" height="12" rx="2"/>
      <rect x="136" y="24" width="20" height="12" rx="2"/>
      <rect x="160" y="24" width="20" height="12" rx="2"/>
      <rect x="184" y="24" width="20" height="12" rx="2"/>
      <rect x="208" y="24" width="20" height="12" rx="2"/>
      <rect x="232" y="24" width="28" height="12" rx="2"/>
    </g>
  </g>

  <!-- Features -->
  <g font-family="monospace" font-size="9" fill="#9b5cff" opacity="0.5">
    <text x="20" y="60">记忆海绵</text>
    <text x="20" y="75">人体工学设计</text>
    <text x="300" y="50">防滑底部</text>
    <text x="300" y="65">透气面料</text>
  </g>

  <!-- Pressure point indicators -->
  <g fill="#9b5cff" opacity="0.3">
    <circle cx="100" cy="130" r="2">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="125" r="2">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="130" r="2">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle cx="50" cy="250" r="2" fill="#9b5cff" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="200" r="1.5" fill="#9b5cff" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
